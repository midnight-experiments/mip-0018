# Local undeployed Midnight 2.x chain for end-to-end tests: official midnightntwrk
# images only, pinned by digest (pins must equal toolchain.json; `npm run check:pins`).
#
# Do not run this file directly: docker/local-stack/up.sh picks the project name
# and random free loopback ports (>= 10000) and writes them to ports.env.
#
#   node                 midnight-node 2.0.0-rc.4       (CFG_PRESET=dev, network id "undeployed")
#   indexer              indexer-standalone 4.4.0-rc.1  (GraphQL /api/v4/graphql)
#   proof-server         proof-server 9.0.0-rc.8        contract circuits: reads Compact 0.35.0 ZKIR v3 (zkir 3.1)
#   wallet-proof-server  proof-server 9.0.0-rc.6        DUST spends the 2.0.0-rc.4 node accepts
#
# Two provers because no single official image does both:
# rc.7/rc.8 DUST-spend proofs are rejected by node 2.0.0-rc.4 (InvalidDustSpendProof,
# error 170) and rc.6 cannot read zkir 3.1 circuits.

name: ${MIP0018_STACK_PROJECT:?set by docker/local-stack/up.sh}

x-labels: &labels
  org.midnight-experiments.mip-0018.prefix: ${MIP0018_DOCKER_PREFIX:?set by docker/local-stack/up.sh}
  org.midnight-experiments.mip-0018.stack: ${MIP0018_STACK_PROJECT}

services:
  node:
    image: midnightntwrk/midnight-node:2.0.0-rc.4@sha256:caf93d6f9fb3630c906ef3e714c151655377f3d28f907d17545de1870514da2e
    labels: *labels
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    ports:
      - 127.0.0.1:${MIP0018_NODE_PORT:?}:9944
    healthcheck:
      # Block 1 must exist (the indexer refuses to start on a chain still at genesis).
      test:
        - CMD-SHELL
        - >-
          curl -fs -H 'Content-Type: application/json'
          -d '{"id":1,"jsonrpc":"2.0","method":"chain_getBlockHash","params":[1]}'
          http://localhost:9944 | grep -q '"result":"0x'
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  indexer:
    image: midnightntwrk/indexer-standalone:4.4.0-rc.1@sha256:5d79f3a20da9ed86236c7f7dc9d93b1beeb0b0c47c9c43a791041322eb80b74e
    labels: *labels
    environment:
      RUST_LOG: indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: local-test-dummy-id
      # Throwaway values for a local, unroutable test stack (the indexer's documented test settings).
      APP__INFRA__STORAGE__PASSWORD: indexer
      APP__INFRA__PUB_SUB__PASSWORD: indexer
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: indexer
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    ports:
      - 127.0.0.1:${MIP0018_INDEXER_PORT:?}:8088
    healthcheck:
      # The image has no curl/wget; the indexer writes this file once it runs.
      test: [CMD-SHELL, cat /var/run/indexer-standalone/running]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: midnightntwrk/proof-server:9.0.0-rc.8@sha256:2666c7bd7b4517f8ad135565387f98d14347a9ac715c6c466d4a8a852b545ecf
    labels: *labels
    environment:
      RUST_BACKTRACE: '1'
    ports:
      - 127.0.0.1:${MIP0018_PROOF_PORT:?}:6300
    healthcheck:
      test: [CMD-SHELL, 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  wallet-proof-server:
    image: midnightntwrk/proof-server:9.0.0-rc.6@sha256:38a819eacde273f725551fdf90ca7c31ebf3c0ff145f3ed58ee35f92fb7ce95b
    labels: *labels
    environment:
      RUST_BACKTRACE: '1'
    ports:
      - 127.0.0.1:${MIP0018_WALLET_PROOF_PORT:?}:6300
    healthcheck:
      test: [CMD-SHELL, 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

networks:
  default:
    labels: *labels

# Local undeployed Midnight 2.x chain for end-to-end tests: official midnightntwrk
# images only, pinned by digest (pins must equal toolchain.json; `npm run check:pins`).
#
# Do not run this file directly: docker/local-stack/up.sh picks the project name
# and random free loopback ports (>= 10000) and writes them to ports.env.
#
#   node          midnight-node 2.1.101            (CFG_PRESET=dev, network id "undeployed")
#   indexer       indexer-standalone 4.4.101       (GraphQL /api/v4/graphql)
#   proof-server  proof-server 9.0.1               contract circuits (ZKIR v3) and the wallet's DUST spends

name: ${MIP0018_STACK_PROJECT:?set by docker/local-stack/up.sh}

x-labels: &labels
  org.midnight-experiments.mip-0018.prefix: ${MIP0018_DOCKER_PREFIX:?set by docker/local-stack/up.sh}
  org.midnight-experiments.mip-0018.stack: ${MIP0018_STACK_PROJECT}

services:
  node:
    image: midnightntwrk/midnight-node:2.1.101@sha256:0c1ad548d523c1109aa1f16daab1bf72dcb78c7e17b8a8c6d97424ad0eba7b8a
    labels: *labels
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    ports:
      - 127.0.0.1:${MIP0018_NODE_PORT:?}:9944
    healthcheck:
      # Block 1 must exist (the indexer refuses to start on a chain still at genesis).
      test:
        - CMD-SHELL
        - >-
          curl -fs -H 'Content-Type: application/json'
          -d '{"id":1,"jsonrpc":"2.0","method":"chain_getBlockHash","params":[1]}'
          http://localhost:9944 | grep -q '"result":"0x'
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  indexer:
    image: midnightntwrk/indexer-standalone:4.4.101@sha256:119f35db548ba1c390845f215bb1e928e73038bef7c315825aee0461bd54499d
    labels: *labels
    environment:
      RUST_LOG: indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: local-test-dummy-id
      # Throwaway key for a local, unroutable test stack (the indexer encrypts wallet viewing keys with it).
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    ports:
      - 127.0.0.1:${MIP0018_INDEXER_PORT:?}:8088
    healthcheck:
      # The image has no curl/wget; the indexer writes this file once it runs.
      test: [CMD-SHELL, cat /var/run/indexer-standalone/running]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: midnightntwrk/proof-server:9.0.1@sha256:90e36a14f92c2004127f0ed1cfd6ee89d770cf1f6e9cd7f02026ffd4ecb42f37
    labels: *labels
    environment:
      RUST_BACKTRACE: '1'
    ports:
      - 127.0.0.1:${MIP0018_PROOF_PORT:?}:6300
    healthcheck:
      test: [CMD-SHELL, 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

networks:
  default:
    labels: *labels
